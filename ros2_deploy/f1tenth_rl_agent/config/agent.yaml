track_server:
  ros__parameters:
    # Path to the Oschersleben centerline CSV (columns x_m, y_m, w_tr_right_m, w_tr_left_m).
    track_csv: "/sim_ws/src/f1tenth_rl_agent/assets/Oschersleben_centerline.csv"
    frame_id: "map"
    republish_hz: 1.0

observation_builder:
  ros__parameters:
    control_hz: 10.0
    contact_margin_m: 0.08
    future_track_num_points: 60
    future_track_horizon_s: 6.0
    future_track_width: 2.2
    # If the simulator publishes odom twist in the world frame instead of body frame,
    # set this True to rotate linear velocity into the body frame before building obs.
    twist_in_world_frame: false
    publish_debug_markers: true

policy_inference:
  ros__parameters:
    # Empty -> random-init actor (plumbing demo). Mount a real .pt at /checkpoints to run trained policy.
    checkpoint_path: ""
    state_dict_key: "actor"
    device: "cpu"
    deterministic: true
    # Keep the random-init demo car moving in RViz (ignored when a checkpoint loads).
    demo_throttle_floor: 0.55

drive_command:
  ros__parameters:
    max_speed: 10.0
    max_steer: 0.4189
    clip_actions: 1.0
    watchdog_timeout_s: 0.5
    # "stop" -> negative throttle commands zero speed; "reverse" -> allow negative speed.
    brake_behavior: "stop"

evaluation:
  ros__parameters:
    oob_margin_m: 0.0
    stuck_speed_mps: 0.2
    stuck_timeout_s: 3.0
    # Match config/sim.yaml ego start pose (sx, sy, stheta).
    reset_x: 0.0
    reset_y: 0.0
    reset_yaw: 2.86
    auto_reset: true
